[project]
name = "dlvmlib"
version = "0.1.0"
description = "Deep latent variable models on zuko distributions, trained by ELBO, IWAE, EUBO, CUBO or SUMO, with STL and DReG encoder gradients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bruno Hebling Vieira", email = "bruno.hebling.vieira@gmail.com" }
]
requires-python = ">=3.10"
# The oldest versions the tests pass on: `torch.func` arrived in torch 2.0 and `zuko.lazy` in zuko 1.3.
dependencies = [
    "torch>=2.0.0",
    "zuko>=1.3.0",
]

[project.urls]
Source = "https://github.com/bhvieira/dlvmlib"
Issues = "https://github.com/bhvieira/dlvmlib/issues"
Changelog = "https://github.com/bhvieira/dlvmlib/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.hatch.build.targets.wheel]
packages = ["dlvmlib"]

# Matches the sibling libraries: long explanatory docstrings and signatures
# that would otherwise wrap badly at 88.
[tool.ruff]
line-length = 120

# Keeps the aligned comments in the README's code blocks, which ruff would otherwise reformat.
[tool.ruff.format]
exclude = ["*.md"]

# stdlib, then torch/zuko, then this package. `tests` is local-folder too, so
# the test helpers land in the same group as the package.
[tool.ruff.lint.isort]
known-local-folder = ["dlvmlib", "tests"]
